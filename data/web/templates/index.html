<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>AI Resume Screener</title>
  <link rel="stylesheet" href="/static/style.css?v=300">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Top App Bar -->
  <header class="app-bar">
    <div class="app-title">
      <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <h1>AI Resume Screener</h1>
    </div>
  </header>

  <!-- Main Mobile Container -->
  <main class="app-container">

    <!-- Configuration Card -->
    <div class="card">
      <h2 class="card-title">Job Requirements</h2>

      <div class="input-group">
        <label for="job-title">Target Role</label>
        <input id="job-title" type="text" placeholder="e.g. Frontend Developer" />
      </div>

      <div class="input-group">
        <label for="skills">Key Skills (comma separated)</label>
        <input id="skills" type="text" placeholder="e.g. React, JavaScript, CSS" />
      </div>

      <div class="input-group">
        <label for="top-n">Top results to show</label>
        <input id="top-n" type="number" min="1" max="50" value="5" />
      </div>
    </div>

    <!-- Upload Options Box -->
    <div class="card">
      <h2 class="card-title">Upload Candidates</h2>
      <p class="subtitle" style="margin-bottom: 24px;">Please choose ONE upload method below.</p>

      <!-- Option A: Single/Multiple Files -->
      <div class="upload-section">
        <label class="upload-section-title">Option A: Upload Individual Resumes</label>
        <div class="upload-zone" id="upload-zone-files">
          <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <polyline points="13 2 13 9 20 9"></polyline>
          </svg>
          <span class="upload-text">Select Resumes (PDF / DOCX)</span>
          <input type="file" id="file_input_resumes" multiple accept=".pdf,.docx" class="hidden-input" />
        </div>
        <div id="file-summary-resumes" class="file-summary hidden">
          <div class="file-badge"><span id="file-count-resumes">0</span> document(s)</div>
          <button id="clear-resumes-btn" class="btn-text small" style="margin-left: 8px;">Clear</button>
        </div>
      </div>

      <!-- Divider -->
      <div class="divider">
        <span>OR</span>
      </div>

      <!-- Option B: ZIP Archive -->
      <div class="upload-section">
        <label class="upload-section-title">Option B: Upload ZIP Archive</label>
        <div class="upload-zone" id="upload-zone-zip">
          <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
            <path
              d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z">
            </path>
          </svg>
          <span class="upload-text">Select ZIP</span>
          <input type="file" id="file_input_zip" accept=".zip" class="hidden-input" />
        </div>
        <div id="file-summary-zip" class="file-summary hidden">
          <div class="file-badge"><span id="file-count-zip">0</span> zip file</div>
          <button id="clear-zip-btn" class="btn-text small" style="margin-left: 8px;">Clear</button>
        </div>
      </div>

    </div>

    <!-- Fixed Action Area (Bottom) -->
    <div class="action-area">
      <button id="analyzeBtn" class="btn-primary">
        Analyze Resumes
      </button>
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="loading-state hidden">
      <div class="spinner"></div>
      <p id="loading-message" class="loading-message">Initializing...</p>
    </div>

    <!-- Results Section -->
    <div id="results-container" class="results-container hidden">
      <div class="results-header">
        <h2>Report</h2>
      </div>
      <div id="results-list" class="results-list">
        <!-- Result cards injected here via JS -->
      </div>
    </div>

  </main>

  <!-- Toast Notifications Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/app.js?v=300"></script>
</body>

</html>
