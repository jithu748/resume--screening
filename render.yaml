services:
  - type: web
    name: resume-screening
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python setup_nltk.py
    startCommand: uvicorn data.src.webapp:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PORT
        value: 8000
    healthCheckPath: /
